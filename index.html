<style>
/* ================= Kollectie: onderdelen die alleen deze app heeft =================
   Alleen tokens uit basis.css en thema.css; geen losse kleuren of maten. */
.kop-wrap{padding-top:var(--ruimte-3)}
#headerextra:empty{display:none}

/* Plaatjes (staand, 5:7) */
.poster{display:block;object-fit:cover;background:var(--tint);flex:none}
.poster.zonder{display:grid;place-items:center;font-weight:var(--gewicht-zwaar);font-size:var(--fs-xl);color:color-mix(in srgb,currentColor 55%,transparent)}
.poster.mini{width:36px;height:50px;border-radius:var(--r-s);font-size:var(--fs-m)}
.poster.groot{width:120px;height:170px;border-radius:var(--r-l);font-size:var(--fs-titel);box-shadow:0 10px 24px var(--schaduw)}

/* Titelpagina: plaatje met cijfer en voortgang */
.hero{display:grid;grid-template-columns:auto 1fr;gap:var(--ruimte-3);align-items:end;margin:var(--ruimte-2) 0 var(--ruimte-2)}
.hero-rechts{display:grid;gap:var(--ruimte-3);min-width:0}
.cijfer-knop{flex-direction:column;align-items:flex-start;gap:var(--ruimte-1);margin:0;padding:var(--ruimte-3) var(--ruimte-4)}
.cijfer-knop b{font-size:var(--fs-titel);font-weight:var(--gewicht-zwaar);letter-spacing:var(--spatie-titel);line-height:1;font-variant-numeric:tabular-nums}
.cijfer-knop b.geen{opacity:.4}
.hero-voortgang{font-size:var(--fs-s);font-weight:var(--gewicht-vet);color:var(--mut);padding:0 var(--ruimte-1)}
.hero-voortgang .voortgang{background:var(--tint);color:var(--st)}

/* Plaatje kiezen: tik op de poster, kies de poster van een seizoen */
.poster-knop{display:block;flex:none;border-radius:var(--r-l)}
.poster-knop:active{transform:scale(.97)}
.plaatjes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--ruimte-3);margin-top:var(--ruimte-3)}
.plaatje-keuze{display:grid;gap:var(--ruimte-1);min-width:0;text-align:left;font-size:var(--fs-xs);font-weight:var(--gewicht-vet);color:var(--mut)}
.plaatje-keuze img{display:block;width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:var(--r-m);background:var(--tint);box-shadow:0 0 0 3px transparent;transition:box-shadow var(--duur-snel)}
.plaatje-keuze span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plaatje-keuze[aria-pressed="true"] img{box-shadow:0 0 0 3px var(--ink)}
.plaatje-keuze[aria-pressed="true"] span{color:var(--ink)}
.plaatjes .skelet{height:auto;aspect-ratio:5/7;margin:0;border-radius:var(--r-m)}

/* Statuskeuze: de gekozen status in zijn eigen kleur */
.chips.status .chip[aria-pressed="true"]{background:var(--c);color:var(--blok-ink)}
.chips.status .chip[aria-pressed="true"] .stip{background:var(--blok-ink)}

/* Seizoensrij: tik op de naam = afleveringen open- of dichtklappen */
.deel-knop{flex:1;min-width:0;display:flex;align-items:center;gap:var(--ruimte-3);min-height:var(--rij);text-align:left}
.deel-knop:disabled{cursor:default}
.deel-knop .rechts{font-variant-numeric:tabular-nums}
.klap{color:var(--mut);display:grid;place-items:center;transition:transform var(--duur) var(--veer)}
.klap svg{width:var(--icoon-s);height:var(--icoon-s)}
.klap.open{transform:rotate(180deg)}
.rij.af .rechts{color:var(--st)}

/* Afleveringen afvinken: rondjes met nummers, tik = tot en met deze gezien */
.afl-paneel{padding:var(--ruimte-1) 0 var(--ruimte-4)}
.afl{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:var(--ruimte-2)}
.afl-n{height:36px;border-radius:var(--r-rond);background:var(--tint);color:var(--mut);font-weight:var(--gewicht-vet);font-size:var(--fs-s);font-variant-numeric:tabular-nums;transition:background-color var(--duur-snel),transform var(--duur-snel)}
.afl-n.gezien{background:var(--st);color:var(--blok-ink)}
.afl-n:active{transform:scale(.88)}
.afl-n:disabled{opacity:.35}
.teller{display:flex;align-items:center;gap:var(--ruimte-2)}
.teller .veld{width:104px;text-align:center;font-variant-numeric:tabular-nums;font-weight:var(--gewicht-vet);padding:0 var(--ruimte-2)}
.teller .van{color:var(--mut);font-weight:var(--gewicht-vet);font-size:var(--fs-m)}
.plus-rond{width:var(--vink);height:var(--vink);display:grid;place-items:center;flex:none;color:var(--mut)}
.plus-rond svg{width:var(--icoon-m);height:var(--icoon-m)}

/* Vensters */
.venster:focus{outline:none}
.venster.zoeken{height:86vh;display:flex;flex-direction:column}
.venster.zoeken #venster-inhoud{display:flex;flex-direction:column;min-height:0;flex:1}
.venster.zoeken #ac{flex:1;overflow-y:auto;margin:var(--ruimte-3) calc(var(--rand) * -1) 0;padding:0 var(--rand)}
.venster .groep{background:color-mix(in srgb,var(--ink) 5%,var(--vlak))}
.venster .groep .veeg-inhoud{background:inherit}
.ac-leeg{margin:0;padding:var(--ruimte-4) var(--ruimte-1);color:var(--mut);font-size:var(--fs-m)}
#al-zoek::-webkit-search-cancel-button,#al-zoek::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.venster .label{margin-top:var(--ruimte-4)}
.venster .knop.breed{margin-top:var(--ruimte-5)}
#bevestig{z-index:var(--z-bevestig)}
.venster.bevestig .veld{margin-bottom:var(--ruimte-2)}
.rating-groot{font-size:var(--fs-titel);font-weight:var(--gewicht-zwaar);letter-spacing:var(--spatie-titel);text-align:center;margin:0 0 var(--ruimte-4);font-variant-numeric:tabular-nums}
.rating-groot.geen{color:var(--mut)}

/* Codescherm (eerste keer openen op een telefoon) */
#code-scherm{position:fixed;inset:0;z-index:calc(var(--z-bevestig) + 10);background:var(--bg);display:grid;place-items:center;padding:var(--ruimte-5)}
.code-kaart{width:100%;max-width:360px;display:grid;gap:var(--ruimte-3);text-align:center}
.code-kaart img{justify-self:center;border-radius:var(--r-l)}
.code-kaart h2{margin:var(--ruimte-1) 0 0;font-size:var(--fs-xl);font-weight:var(--gewicht-zwaar)}
.code-kaart p{margin:0 0 var(--ruimte-2);color:var(--mut)}

/* Kalender */
.kal-groep .groep-kop{font-size:var(--fs-l)}
.kal-groep .rechts{font-variant-numeric:tabular-nums;flex:none}
.kal-groep .rechts.uit{color:var(--blok-3)}
.kal-groep .rij .chip{flex:none;gap:var(--ruimte-1)}
.kal-groep .rij .chip svg{width:var(--icoon-s);height:var(--icoon-s)}
.kal-leeg{margin:0 var(--ruimte-2);color:var(--mut);font-size:var(--fs-m)}
.kal-voet{margin:var(--ruimte-5) var(--ruimte-2) var(--ruimte-6);color:var(--mut);font-size:var(--fs-xs)}

/* Preview-label */
#preview-pill{position:fixed;left:var(--ruimte-2);bottom:calc(var(--ruimte-2) + env(safe-area-inset-bottom,0px));z-index:var(--z-actie);background:var(--tint);color:var(--mut);font-size:var(--fs-xs);font-weight:var(--gewicht-vet);letter-spacing:var(--spatie-label);border-radius:var(--r-rond);padding:var(--ruimte-1) var(--ruimte-2)}
</style>

<div id="scroller"><div class="scherm">

    <div class="kop">
      <div class="kop-links">
        <button type="button" class="schakelaar" id="schakelaar" aria-haspopup="menu" aria-expanded="false"><h1 class="titel" id="title">Anime</h1><span class="pijl"><svg data-icoon="pijl-onder" aria-hidden="true"></svg></span></button>
        <div class="schermmenu" id="schermmenu" role="menu" hidden></div>

</div></div>

<button type="button" class="actieknop" id="actieknop" data-act="toevoeg-open" hidden><svg data-icoon="plus" aria-hidden="true"></svg>Anime toevoegen</button>

<div id="venster" class="venster-wrap" hidden>

    <button type="button" class="rond-knop sluit" data-act="sluit" aria-label="Sluiten"><svg data-icoon="kruis" aria-hidden="true"></svg></button>

  </div>
</div>
<div id="bevestig" class="venster-wrap" hidden></div>
<div class="melding" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-btn" hidden></button></div>

<script>
/* ================= Verbinding met het loket (Apps Script) =================
   Plak hieronder het adres van je Apps Script-webapp (eindigt op /exec).
   Leeg laten = previewmodus met voorbeelddata. */
const API_URL = 'https://script.google.com/macros/s/AKfycbzvZqn5IrCF5pv_YFCuuGQkhqMSOl4Jj1XP_5d_eqccJxAZ72ntISv-ie9rWnh3RBmi/exec';

(function () {
  if (!API_URL) return; // geen loket: previewmodus
  window.API_MODUS = true;
  const KEY = 'kollectie-code';
  const code = () => { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } };
  function vraagCode(melding) {
    if (document.getElementById('code-scherm')) return;
    const toon = () => {
      const w = document.createElement('div');
      w.id = 'code-scherm';
      w.innerHTML = `<form class="code-kaart">
          <img src="icon-180.png" alt="" width="72" height="72">
          <h2>Kollectie</h2>
          <p>${melding || 'Voer de geheime code in.'}</p>
          <input class="veld" id="code-invoer" type="password" autocomplete="current-password" placeholder="Geheime code" aria-label="Geheime code">
          <button class="knop breed" type="submit">Openen</button>
        </form>`;
      document.body.appendChild(w);
      const inp = w.querySelector('#code-invoer');
      w.querySelector('form').addEventListener('submit', e => {
        e.preventDefault(); e.stopPropagation();
        const v = inp.value.trim(); if (!v) return;
        try { localStorage.setItem(KEY, v); } catch (err) {}
        location.reload();
      }, true);
      inp.focus();
    };
    document.body ? toon() : document.addEventListener('DOMContentLoaded', toon);
  }
  window.LOKET = async function (actie, ...args) {
    if (!code()) { vraagCode(); throw new Error('Geen code ingevoerd'); }
    const r = await fetch(API_URL, { method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ sleutel: code(), actie, args }) });
    const d = await r.json();
    if (d.fout === 'sleutel') {
      try { localStorage.removeItem(KEY); } catch (e) {}
      vraagCode('Die code klopt niet. Probeer het opnieuw.');
      throw new Error('Onjuiste code');
    }
    if (d.fout) throw new Error(d.fout);
    return d.data;
  };
})();
</script>
<script>

(function () {
  if (window.LOKET) return;
  const KEY = 'kollectie-preview-v1';
  const CDN = 'https://s4.anilist.co/file/anilistcdn/media/anime/cover/medium/';
  function demo() {
    const nu = Date.now(), dag = 864e5;

      ['t1', 'Attack on Titan', 'bx16498-buvcRTBx4NSm.jpg', 'watching', '', 1],
      ['t2', 'Demon Slayer: Kimetsu no Yaiba', 'bx101922-WBsBl0ClmgYL.jpg', 'waiting', 8.7, 20],
      ['t3', 'Frieren: Beyond Journey’s End', 'bx154587-qQTzQnEJJ3oB.jpg', 'finished', 9.4, 60],
      ['t4', 'One Piece', 'bx21-ELSYx3yMPcKM.jpg', 'watching', 9, 3],
      ['t5', 'Jujutsu Kaisen', 'bx113415-LHBAeoZDIsnF.jpg', 'towatch', '', 5],
      ['t6', 'Spy x Family', 'bx140960-Kb6R5nYQfjmP.jpg', 'dropped', 6.5, 90],
      ['t7', 'Tokyo Ghoul', 'b20605-k665mVkSug8D.jpg', 'finished', 7, 300]
    ];
    const titels = T.map(([id, naam, img, status, rating, d]) => ({ id, soort: 'anime', naam, plaatje: CDN + img, status, rating, toegevoegd: nu - d * dag - 1e9, gewijzigd: nu - d * dag }));
    let n = 0;
    const deel = (titelId, soort, naam, bronId, formaat, jaar, afleveringen, gezien, bronStatus = 'FINISHED', extra = {}) =>
      Object.assign({ id: 'd' + (++n), titelId, soort, positie: n, naam, bronId, formaat, jaar, afleveringen, uitgezonden: '', gezien, bronStatus, alt: '', gecheckt: nu }, extra);
    const delen = [
      deel('t1', 'seizoen', '', 16498, 'TV', 2013, 25, 25),
      deel('t1', 'seizoen', 'Seizoen 2', 20958, 'TV', 2017, 12, 12),
      deel('t1', 'seizoen', 'Seizoen 3', 99147, 'TV', 2018, 12, 7),
      deel('t1', 'seizoen', 'Seizoen 3 Part 2', 104578, 'TV', 2019, 10, 0),
      deel('t1', 'seizoen', 'The Final Season', 110277, 'TV', 2020, 16, 0),
      deel('t1', 'seizoen', 'The Final Season Part 2', 131681, 'TV', 2022, 12, 0),
      deel('t2', 'seizoen', '', 101922, 'TV', 2019, 26, 26),
      deel('t2', 'seizoen', 'Mugen Train Arc', 129874, 'TV', 2021, 7, 7, 'FINISHED', { alt: 112151 }),
      deel('t2', 'seizoen', 'Entertainment District Arc', 142329, 'TV', 2021, 11, 11),
      deel('t2', 'seizoen', 'Swordsmith Village Arc', 145139, 'TV', 2023, 11, 11),
      deel('t2', 'seizoen', 'Hashira Training Arc', 166240, 'TV', 2024, 8, 8),
      deel('t2', 'extra', 'The Movie: Mugen Train', 112151, 'MOVIE', 2020, 1, 1, 'FINISHED', { alt: 129874 }),
      deel('t2', 'extra', 'Infinity Castle', 178788, 'MOVIE', 2025, 1, 1),
      deel('t2', 'extra', 'Infinity Castle Part 2', 0, 'MOVIE', '', 1, 0, 'NOT_YET_RELEASED'),
      deel('t3', 'seizoen', '', 154587, 'TV', 2023, 28, 28),
      deel('t4', 'seizoen', '', 21, 'TV', 1999, '', 845, 'RELEASING', { uitgezonden: 1180 }),
      deel('t5', 'seizoen', '', 113415, 'TV', 2020, 24, 0),
      deel('t5', 'seizoen', 'Seizoen 2', 145064, 'TV', 2023, 23, 0),
      deel('t6', 'seizoen', '', 140960, 'TV', 2022, 12, 5),
      deel('t7', 'seizoen', '', 20605, 'TV', 2014, 12, 12)
    ];
    return { titels, delen, instellingen: [{ id: 'taal', waarde: 'engels' }] };
  }
  let db = null;
  try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!db) db = demo();
  const opslaan = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };
  const kopie = x => JSON.parse(JSON.stringify(x));
  const api = {
    getState: () => kopie(db),
    bewaar: (t, rijen) => {
      rijen.forEach(r => { const b = db[t].find(x => x.id === r.id); if (b) Object.assign(b, r); else db[t].push(Object.assign({}, r)); });
      opslaan(); return api.getState();
    },
    verwijder: (t, ids) => { db[t] = db[t].filter(x => !ids.includes(x.id)); opslaan(); return api.getState(); }
  };
  window.PREVIEW = true;
  window.previewReset = () => { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); };
  window.LOKET = (actie, ...args) => new Promise((ok, fout) => setTimeout(() => { try { ok(api[actie](...kopie(args))); } catch (e) { fout(e); } }, 120));

    document.body.appendChild(b);
  });
})();
</script>

/* ---------- Vaste waarden ---------- */
const STATUSSEN = [
  { id: 'watching', naam: 'Watching' },

];
const statusNaam = id => id === 'alles' ? 'Alles' : (STATUSSEN.find(s => s.id === id) || STATUSSEN[1]).naam;
const FORMATEN = { TV: 'TV', TV_SHORT: 'Kort', ONA: 'ONA', OVA: 'OVA', MOVIE: 'Film', SPECIAL: 'Special', MUSIC: 'Muziek' };
const SEIZOEN_FORMATEN = ['TV', 'TV_SHORT', 'ONA'];
/** Alleen seizoenen en films; OVA's, specials en muziek laat de app weg. */
const telt = m => isSeizoen(m) || m.format === 'MOVIE';
/** Telt als seizoen: series, behalve losse webfilmpjes van één of twee afleveringen. */
const isSeizoen = m => SEIZOEN_FORMATEN.includes(m.format) && !(m.format === 'ONA' && m.episodes && m.episodes <= 2);
const NOG_BEZIG = ['RELEASING', 'NOT_YET_RELEASED', 'HIATUS'];
const LANG_SEIZOEN = 100; // vanaf zoveel afleveringen een teller in plaats van rondjes

/* ---------- Hulpjes ---------- */
const S = { data: null, tab: 'anime', status: 'watching', titelOpen: null, uitklap: {} };
try { S.status = localStorage.getItem('kollectie-status') || 'watching'; } catch (e) {}
let bezig = 0, teller = 0;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nieuwId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const getal = v => { const n = Number(v); return v === '' || v == null || isNaN(n) ? 0 : n; };
const cijferTekst = r => r === '' || r == null ? '' : String(Math.round(Number(r) * 10) / 10).replace('.', ',');
const opNaam = (a, b) => a.naam.localeCompare(b.naam, 'nl');

const D = () => S.data;
const titel = id => D().titels.find(t => t.id === id);
// Een extra die geen film is (OVA, special, van vóór deze regel) blijft in de Sheet, maar de app toont en telt hem niet
const zichtbaar = d => d.soort !== 'extra' || !d.formaat || d.formaat === 'MOVIE';
const delenVan = id => D().delen.filter(d => d.titelId === id && zichtbaar(d)).sort((a, b) => getal(a.positie) - getal(b.positie));
const seizoenenVan = id => delenVan(id).filter(d => d.soort !== 'extra');
const extrasVan = id => delenVan(id).filter(d => d.soort === 'extra');
const taal = () => ((D().instellingen || []).find(x => x.id === 'taal') || { waarde: 'engels' }).waarde;
/** Hoeveel afleveringen er nu te kijken zijn: bij een lopende serie het aantal dat al is uitgezonden. */
const beschikbaar = d => d.bronStatus === 'NOT_YET_RELEASED' ? 0 : (getal(d.uitgezonden) || getal(d.afleveringen));
const deelNaam = (d, k) => d.naam || (d.soort === 'extra' ? 'Film' : 'Seizoen ' + (k + 1));
const posterHtml = (t, klasse = '') => t.plaatje

/* ---------- Opslag: optimistisch (Kage Syztem, hoofdstuk 6) ---------- */
const LOKAAL = 'kollectie-stand';
function onthoudLokaal(s) { if (!window.API_MODUS) return; try { localStorage.setItem(LOKAAL, JSON.stringify(s)); } catch (e) {} }
function leesLokaal() { if (!window.API_MODUS) return null; try { return JSON.parse(localStorage.getItem(LOKAAL)); } catch (e) { return null; } }
function tekenSkelet() { $('#main').innerHTML = '<div class="skelet"></div>'.repeat(5); }
function laad() {
  if (!S.data) { const l = leesLokaal(); if (l) { S.data = l; wissel(S.tab); } else tekenSkelet(); }
  LOKET('getState')
    .then(s => { const eerste = !S.data; S.data = s; onthoudLokaal(s); if (eerste) wissel(S.tab); else if (!bezig) teken(); })
    .catch(e => { if (!S.data) $('#main').innerHTML = `<div class="leeg"><strong>Laden lukte niet</strong>${esc(e.message)}. Herlaad de pagina.</div>`; });
}
function bel(fn, ...args) {
  bezig++; teller++;
  LOKET(fn, ...args)
    .then(s => { bezig--; if (!bezig) { S.data = s; onthoudLokaal(s); teken(); } })
    .catch(e => { bezig--; melding('Opslaan lukte niet (' + e.message + '). Gegevens worden opnieuw geladen.'); laad(); });
}
function peil() {
  if (!S.data || bezig || document.visibilityState !== 'visible' || !window.API_MODUS) return;
  const t = teller;
  LOKET('getState').then(s => { if (!bezig && t === teller) { S.data = s; onthoudLokaal(s); teken(); } }).catch(() => {});
}
setInterval(peil, 15000);
document.addEventListener('visibilitychange', peil);
function bewaar(tabel, rijen) {
  rijen.forEach(r => {
    const b = D()[tabel].find(x => x.id === r.id);
    if (b) Object.assign(b, r); else D()[tabel].push(Object.assign({}, r));
  });
  teken();
  bel('bewaar', tabel, rijen);
}
function verwijder(tabel, ids) {
  D()[tabel] = D()[tabel].filter(x => !ids.includes(x.id));
  teken();
  bel('verwijder', tabel, ids);
}

/* ---------- Status automatisch ----------
   Eerste vink: Watching. Alles gezien: Finished, of Waiting als er nog iets uitkomt.
   Films tellen niet mee voor "alles gezien", wel voor "er komt nog iets". */
function nieuweStatus(t) {
  const sz = seizoenenVan(t.id), alle = delenVan(t.id);
  const iets = alle.some(d => getal(d.gezien) > 0);
  const telbaar = sz.filter(d => beschikbaar(d) > 0);
  const klaar = telbaar.length > 0 && telbaar.every(d => getal(d.gezien) >= beschikbaar(d));
  if (klaar) return alle.some(d => NOG_BEZIG.includes(d.bronStatus)) ? 'waiting' : 'finished';
  if (iets && t.status !== 'watching') return 'watching';
  return t.status;
}
/** Bewaar gewijzigde delen en pas zo nodig de status van de titel aan. */
function bewaarDelen(titelId, wijzigingen, undo) {
  const t = titel(titelId);
  const oud = t.status;
  wijzigingen.forEach(w => Object.assign(D().delen.find(d => d.id === w.id), w));
  const nieuw = nieuweStatus(t);
  const tRij = { id: t.id, gewijzigd: Date.now() };
  if (nieuw !== oud) tRij.status = nieuw;
  bel('bewaar', 'delen', wijzigingen);
  bewaar('titels', [tRij]);
  if (nieuw !== oud) melding(`Status: ${statusNaam(nieuw)}`, undo ? 'Ongedaan maken' : '', undo);
  else if (undo) melding('Seizoen bijgewerkt.', 'Ongedaan maken', undo);
}

/** Houd de gekozen chip in beeld. */

/* ---------- Overzicht ---------- */
/** Het seizoen waar je nu bent: gezien, totaal en welk seizoen. */
function voortgang(t) {
  const sz = seizoenenVan(t.id);
  const k = sz.findIndex(d => getal(d.gezien) < beschikbaar(d));
  if (k < 0) return null;
  const d = sz[k];
  return { gezien: getal(d.gezien), tot: getal(d.afleveringen) || beschikbaar(d), seizoen: sz.length > 1 ? k + 1 : 0, lopend: !getal(d.afleveringen) };
}
/** Het grote getal rechts in een blok, met een woordje eronder. */
function getalVan(t) {
  if (t.status === 'watching') {
    const v = voortgang(t);
    if (v) return v.tot >= LANG_SEIZOEN || v.lopend ? [v.gezien, 'van ' + (v.tot || '?')] : [`${v.gezien}/${v.tot || '?'}`, v.seizoen ? 'seizoen ' + v.seizoen : 'afleveringen'];
  }
  const c = cijferTekst(t.rating);
  if (c) return [c, 'jouw cijfer'];
  if (t.status === 'towatch') {
    const n = seizoenenVan(t.id).reduce((s, d) => s + (getal(d.afleveringen) || beschikbaar(d)), 0);
    if (n) return [n, 'afleveringen'];
  }
  return null;
}
function tekenAnime() {

  }).join('')}</div>`;
  chipInBeeld($('#headerextra .chips'));
  const alles = S.status === 'alles';
  // Klaar (Waiting, Finished, Dropped): hoogste cijfer eerst, zonder cijfer onderaan. De rest: laatst gewijzigd eerst.
  const heeftCijfer = t => t.rating !== '' && t.rating != null;
  const opCijfer = (a, b) => (heeftCijfer(b) - heeftCijfer(a)) || (getal(b.rating) - getal(a.rating)) || opNaam(a, b);
  const opRecent = (a, b) => getal(b.gewijzigd) - getal(a.gewijzigd);

/** Blok of rij die je naar links veegt voor acties met alleen iconen. */

/** Het opengeklapte seizoen: je eigen keuze, anders het eerste dat nog niet af is. */
function openSeizoen(titelId) {
  if (S.uitklap[titelId] !== undefined) return S.uitklap[titelId];
  const d = seizoenenVan(titelId).find(d => getal(d.gezien) < beschikbaar(d));
  return d ? d.id : null;
}
const navRij = (act, icoon, tekst, id, gevaar) => `<button type="button" class="rij${gevaar ? ' gevaar' : ''}" data-act="${act}" data-id="${id}"><span class="rij-ico">${ico(icoon)}</span><span class="naam">${tekst}</span>${gevaar ? '' : `<span class="pijltje rij-ico">${ico('pijl-rechts')}</span>`}</button>`;
function deelRij(d, k, open) {
  const max = beschikbaar(d), tot = getal(d.afleveringen) || max, g = getal(d.gezien);
  const af = max > 0 && g >= max;
  const extra = d.soort === 'extra';
  let meta = '';
  if (d.bronStatus === 'NOT_YET_RELEASED') meta = 'Nog niet uit';
  else if (d.alt) { const a = D().delen.find(x => x.titelId === d.titelId && String(x.bronId) === String(d.alt)); if (a) meta = 'Zelfde verhaal als ' + deelNaam(a, seizoenenVan(d.titelId).indexOf(a)); }
  const rechts = extra ? 'Film' : `${g}/${tot || '?'}`;
  const naam = deelNaam(d, k);
  const klapbaar = !extra && max;
  let h = veegRij('d-' + d.id, [['wijzig', 'deel-wijzig', d.id, `${naam} wijzigen`], ['weg', 'deel-weg', d.id, `${naam} verwijderen`]],
    `<div class="rij${af ? ' af' : ''}">
      <button type="button" class="vink" aria-pressed="${af}" data-act="deel-vink" data-id="${d.id}" aria-label="${esc(naam)} ${af ? 'niet gezien' : 'helemaal gezien'}"${max ? '' : ' disabled'}>${ico('vinkje')}</button>
      <button type="button" class="deel-knop" data-act="${extra ? 'deel-vink' : 'deel-klap'}" data-id="${d.id}"${max ? '' : ' disabled'}>
        <span class="rij-tekst"><span class="naam">${esc(naam)}</span>${meta ? `<span class="bijregel">${esc(meta)}</span>` : ''}</span>
        <span class="rechts">${esc(rechts)}</span>
        ${klapbaar ? `<span class="klap${open ? ' open' : ''}">${ico('pijl-onder')}</span>` : ''}

    </div>`);

}
function afleveringen(d) {

  if (tot > LANG_SEIZOEN) return `<div class="teller">
      <button type="button" class="rond-knop" data-act="afl-stap" data-id="${d.id}" data-stap="-1" aria-label="Eén aflevering terug">${ico('min')}</button>
      <input class="veld" type="number" inputmode="numeric" min="0" max="${max}" value="${g}" data-afl-invoer="${d.id}" aria-label="Gezien tot en met aflevering">
      <button type="button" class="rond-knop" data-act="afl-stap" data-id="${d.id}" data-stap="1" aria-label="Volgende aflevering gezien">${ico('plus')}</button>
      <span class="van">van ${max}</span></div>`;
  let h = '<div class="afl">';
  for (let n = 1; n <= tot; n++) h += `<button type="button" class="afl-n${n <= g ? ' gezien' : ''}" data-act="afl" data-id="${d.id}" data-n="${n}"${n > max ? ' disabled' : ''} aria-label="Tot en met aflevering ${n} gezien">${n}</button>`;
  return h + '</div>';
}
/** Lopende delen bijwerken vanaf AniList (hoogstens één keer per 6 uur per titel). */
async function ververs(t) {
  const oud = delenVan(t.id).filter(d => d.bronId && (NOG_BEZIG.includes(d.bronStatus) || !d.afleveringen) && Date.now() - getal(d.gecheckt) > 6 * 36e5);
  if (!oud.length || S.ververs === t.id) return;
  S.ververs = t.id;
  try {
    const data = await anilist('query{' + oud.map((d, i) => `m${i}:Media(id:${Number(d.bronId)}){${MEDIA}}`).join(' ') + '}');
    const w = oud.map((d, i) => { const m = data['m' + i]; if (!m) return { id: d.id, gecheckt: Date.now() };
      return { id: d.id, gecheckt: Date.now(), bronStatus: m.status, afleveringen: m.episodes || '', uitgezonden: m.nextAiringEpisode ? m.nextAiringEpisode.episode - 1 : '' }; });
    bewaarDelen(t.id, w);
  } catch (e) { /* stil: probeer het de volgende keer opnieuw */ }
  S.ververs = null;
}

/* ---------- Kalender ----------
   Alles van AniList, niets in de Sheet: komende afleveringen (4 weken) en aangekondigde seizoenen en films.
   Alle titels behalve Dropped. Opgehaald bij openen, hoogstens één keer per half uur. */
const KAL_DAGEN = 28;
const SEIZOEN_NAAM = { WINTER: 'Winter', SPRING: 'Lente', SUMMER: 'Zomer', FALL: 'Herfst' };
const SEIZOEN_MAAND = { WINTER: 1, SPRING: 4, SUMMER: 7, FALL: 10 };
const beginDag = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
const hoofdletter = s => s.charAt(0).toUpperCase() + s.slice(1);
const klokTijd = s => new Date(s * 1000).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
/** Delen met een AniList-id, van alle titels behalve Dropped. */
function kalDelen() {
  const tIds = new Set(D().titels.filter(t => t.soort === 'anime' && t.status !== 'dropped').map(t => t.id));
  return D().delen.filter(d => d.bronId && tIds.has(d.titelId) && zichtbaar(d));
}
const kalDeel = id => kalDelen().find(d => Number(d.bronId) === Number(id));
/** Aantal afleveringen in de komende 7 dagen (voor het schermmenu). */
function kalDezeWeek() {
  if (!S.kal || !S.kal.uitz) return '';
  const nu = Date.now() / 1000;
  return S.kal.uitz.filter(u => u.airingAt > nu && u.airingAt < nu + 7 * 86400).length || '';
}
async function allePaginas(query, vars, pak) {
  const uit = [];
  for (let p = 1; p <= 10; p++) {
    const d = await anilist(query, Object.assign({ p }, vars));
    uit.push(...pak(d.Page));
    if (!d.Page.pageInfo.hasNextPage) break;
  }
  return uit;
}
async function haalKalender() {
  const delen = kalDelen();
  const sleutel = [...new Set(delen.map(d => Number(d.bronId)))].sort((a, b) => a - b).join(',');
  const k = S.kal;
  if (k && (k.laden || (k.sleutel === sleutel && Date.now() - k.tijd < 30 * 6e4))) return;
  S.kal = Object.assign({}, k, { laden: true, sleutel });
  try {
    const ids = sleutel ? sleutel.split(',').map(Number) : [];
    const MK = MEDIA.replace('nextAiringEpisode{episode}', 'nextAiringEpisode{episode airingAt}') + ' season seasonYear';
    const media = ids.length ? await allePaginas(`query($ids:[Int],$p:Int){Page(page:$p,perPage:25){pageInfo{hasNextPage} media(id_in:$ids,type:ANIME){${MK} relations{edges{relationType node{${MK} type}}}}}}`, { ids }, P => P.media) : [];
    // Aangekondigd: delen in je lijst die nog niet uit zijn, plus vervolgen die nog niet in je lijst staan
    const aank = [], al = new Set();
    media.forEach(m => {
      const d = delen.find(x => Number(x.bronId) === m.id);
      if (!d) return;
      if (m.status === 'NOT_YET_RELEASED' && !al.has(m.id)) { al.add(m.id); aank.push({ m, titelId: d.titelId }); }
      m.relations.edges.forEach(e => {
        const n = e.node;
        if (n.type !== 'ANIME' || n.status !== 'NOT_YET_RELEASED' || al.has(n.id) || !telt(n)) return;
        if (!((e.relationType === 'SEQUEL' && !andereSerie(m, n)) || (e.relationType === 'SIDE_STORY' && n.format === 'MOVIE'))) return;
        al.add(n.id); aank.push({ m: n, titelId: d.titelId });
      });
    });
    // Komende afleveringen van alles wat loopt of nog moet beginnen (vanaf het begin van vandaag)
    const lopend = media.filter(m => NOG_BEZIG.includes(m.status)).map(m => m.id);
    const van = Math.floor(beginDag(new Date()) / 1000), tot = van + KAL_DAGEN * 86400;
    const uitz = lopend.length ? await allePaginas(`query($ids:[Int],$van:Int,$tot:Int,$p:Int){Page(page:$p,perPage:50){pageInfo{hasNextPage} airingSchedules(mediaId_in:$ids,airingAt_greater:$van,airingAt_lesser:$tot,sort:TIME){episode airingAt mediaId}}}`, { ids: lopend, van, tot }, P => P.airingSchedules) : [];
    S.kal = { tijd: Date.now(), sleutel, media: new Map(media.map(m => [m.id, m])), aank, uitz };
  } catch (e) {
    S.kal = Object.assign({}, S.kal, { laden: false, tijd: Date.now(), fout: e.message });
  }
  if (S.tab === 'kalender' && !S.titelOpen) teken(); else zetMenu(S.tab);
}
/** Waar een aangekondigd deel in de tijd valt: sorteersleutel, groep en korte datum. */
function aankWanneer(m) {
  const s = m.startDate || {}, na = m.nextAiringEpisode && m.nextAiringEpisode.airingAt;
  const maandNaam = (j, mnd) => hoofdletter(new Date(j, mnd - 1, 1).toLocaleDateString('nl-NL', { month: 'long', year: 'numeric' }));
  if (na) { const d = new Date(na * 1000); return { sl: d.getFullYear() * 1e4 + (d.getMonth() + 1) * 100 + d.getDate(), groep: maandNaam(d.getFullYear(), d.getMonth() + 1), kort: d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' }) }; }
  if (s.year && s.month) return { sl: s.year * 1e4 + s.month * 100 + (s.day || 32), groep: maandNaam(s.year, s.month), kort: s.day ? new Date(s.year, s.month - 1, s.day).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' }) : '' };
  const j = s.year || m.seasonYear;
  if (j && m.season) return { sl: j * 1e4 + SEIZOEN_MAAND[m.season] * 100 + 33, groep: `${SEIZOEN_NAAM[m.season]} ${j}`, kort: '' };
  if (j) return { sl: j * 1e4 + 1300, groep: String(j), kort: '' };
  return { sl: 1e9, groep: 'Nog geen datum', kort: '' };
}
function tekenKalender() {

  $('#headerextra').innerHTML = '';
  haalKalender();
  const k = S.kal;

  const nu = Date.now() / 1000, vandaag = beginDag(new Date());

  if (!dagen.size) h += `<p class="kal-leeg">Geen afleveringen in de komende ${KAL_DAGEN / 7} weken.</p>`;
  dagen.forEach((per, dag) => {

        x.van === 1 ? afl + ' · première' : totaal && x.tot === totaal ? afl + ' · finale' : totaal ? `${afl} van ${totaal}` : afl
      ].filter(Boolean).join(' · ');
      const uit = x.at <= nu;
      h += `<button type="button" class="rij" data-act="titel-open" data-id="${t.id}">

    });
    h += '</div>';
  });

  // Aangekondigd: wat al in de lijst met afleveringen staat, hoeft hier niet nog eens
  const inAgenda = new Set(k.uitz.map(u => u.mediaId));
  const aank = k.aank.filter(a => !inAgenda.has(a.m.id) && titel(a.titelId) && titel(a.titelId).status !== 'dropped')
    .map(a => Object.assign({ w: aankWanneer(a.m) }, a)).sort((a, b) => a.w.sl - b.w.sl);

  const groepen = new Map();

  groepen.forEach((lijst, naam) => {

    lijst.forEach(a => {
      const t = titel(a.titelId), d = inLijst(a.m.id);
      const poster = posterHtml({ naam: t.naam, plaatje: (a.m.coverImage || {}).medium || t.plaatje }, 'mini');
      const deel = d ? deelNaam(d, d.soort === 'extra' ? extrasVan(t.id).indexOf(d) : seizoenenVan(t.id).indexOf(d)) : (kortNaam(mediaNaam(a.m), t.naam) || mediaNaam(a.m));
      const bij = [deel, FORMATEN[a.m.format] === 'Film' && !/film|movie/i.test(deel) ? 'Film' : '', a.w.kort].filter(Boolean).join(' · ');
      const tekst = `${poster}<span class="rij-tekst"><span class="naam">${esc(t.naam)}</span><span class="bijregel">${esc(bij)}</span></span>`;

  h += `<p class="kal-voet">Tijden zijn de uitzending in Japan, in jouw tijd. Op streamingdiensten vaak een paar uur later.${k.fout ? ' Bijwerken lukte niet, dit is de laatste stand.' : ''}</p>`;

/** Aangekondigd vervolg meteen als seizoen of film bij de titel zetten. */
function kalToevoegen(id) {
  const a = S.kal && S.kal.aank.find(x => x.m.id === id);
  if (!a) return;
  if (inLijst(id)) return melding('Staat al in je lijst.');
  const t = titel(a.titelId), m = a.m;
  const naam = kortNaam(mediaNaam(m), t.naam);
  const pos = Math.max(0, ...delenVan(t.id).map(d => getal(d.positie))) + 1;
  bewaar('delen', [deelUitMedia(t.id, { m, soort: isSeizoen(m) ? 'seizoen' : 'extra', naam, alt: '' }, pos)]);
  bewaar('titels', [{ id: t.id, status: nieuweStatus(t), gewijzigd: Date.now() }]);
  melding(`${naam || mediaNaam(m)} toegevoegd aan ${t.naam}.`);
}


/* ================= AniList ================= */
const MEDIA = 'id title{romaji english} format episodes status startDate{year month day} nextAiringEpisode{episode} coverImage{large medium}';
async function anilist(query, variables = {}, poging = 0) {
  const r = await fetch('https://graphql.anilist.co', { method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ query, variables }) });
  if (r.status === 429 && poging < 2) {
    await new Promise(k => setTimeout(k, (Number(r.headers.get('Retry-After')) || 3) * 1000));
    return anilist(query, variables, poging + 1);
  }
  const d = await r.json();
  if (d.errors && !d.data) throw new Error(d.errors[0].message);
  return d.data;
}
const mediaNaam = m => (taal() === 'romaji' ? m.title.romaji || m.title.english : m.title.english || m.title.romaji) || '';
const datumWaarde = m => { const s = m.startDate || {}; return s.year ? s.year * 1e4 + (s.month || 12) * 100 + (s.day || 28) : 99999999; };
/** Naam zonder de naam van de reeks ervoor: "Demon Slayer: … Mugen Train Arc" wordt "Mugen Train Arc". */
function kortNaam(vol, basis) {
  let n = vol;
  if (basis && vol.toLowerCase().startsWith(basis.toLowerCase())) n = vol.slice(basis.length).replace(/^[\s:\-–—.,]+/, '');
  return n.replace(/^Season (\d+)/i, 'Seizoen $1').replace(/\bSeason (\d+)\b/i, 'Seizoen $1');
}
function basisNaam(m) {
  return mediaNaam(m).replace(/\s*(\(TV\)|Season 1|1st Season)$/i, '').trim();
}
/** Kern van een naam, zonder seizoen of ondertitel: "Naruto: Shippuden" → "naruto", "Attack on Titan Season 3" → "attackontitan". */
const naamKern = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .split(/[:：(]|\s(?:season|part)\b|\s\d+(?:st|nd|rd|th)\b/)[0].replace(/[^a-z0-9]+/g, '');
/** Is dit vervolg een nieuwe serie in plaats van een nieuw seizoen?
    Ja als de naam verandert (Naruto → Boruto, Dragon Ball Z → Dragon Ball GT),
    of als beide lange series zijn (Naruto 220 → Shippuden 500 afleveringen). */
function andereSerie(a, b) {
  const ka = [a.title.english, a.title.romaji].map(naamKern).filter(Boolean);
  const kb = [b.title.english, b.title.romaji].map(naamKern).filter(Boolean);
  const zelfdeNaam = ka.some(x => kb.some(y => x.startsWith(y) || y.startsWith(x)));
  if (!zelfdeNaam) return true;
  return isSeizoen(a) && isSeizoen(b) && getal(a.episodes) >= LANG_SEIZOEN && getal(b.episodes) >= LANG_SEIZOEN;
}
/** Zoek de hele reeks rond één titel: vervolgen en voorgangers (PREQUEL/SEQUEL), plus de zijverhalen
    en dubbele versies (SIDE_STORY, ALTERNATIVE) die daar direct aan hangen. Per stap één verzoek.
    Een vervolg dat een andere serie is (zie andereSerie) wordt een eigen titel en komt er niet bij. */
async function haalReeks(startId) {
  const knopen = new Map(), zij = new Map(), alt = new Map();
  let rand = [startId], ronde = 0, startOpnieuw = true;
  while (rand.length && knopen.size < 40 && ronde < 15) {
    const volgende = [];
    for (let i = 0; i < rand.length; i += 6) {
      const stuk = rand.slice(i, i + 6);
      const data = await anilist('query{' + stuk.map((id, k) => `m${k}:Media(id:${id}){${MEDIA} relations{edges{relationType node{${MEDIA} type}}}}`).join(' ') + '}');
      Object.values(data).forEach(m => {
        if (!m) return;
        knopen.set(m.id, m);
        m.relations.edges.forEach(e => {
          const n = e.node; if (n.type !== 'ANIME') return;
          if (e.relationType === 'PREQUEL' || e.relationType === 'SEQUEL') {
            if (andereSerie(m, n)) return; // eigen titel, geen seizoen of extra
            if (!knopen.has(n.id) && !rand.includes(n.id) && !volgende.includes(n.id)) volgende.push(n.id);
          } else if (e.relationType === 'ALTERNATIVE' && isSeizoen(n)) {
            // Een andere serie over hetzelfde verhaal (FMA en FMA: Brotherhood): een eigen titel, geen seizoen
          } else if (['SIDE_STORY', 'ALTERNATIVE', 'PARENT'].includes(e.relationType) && !zij.has(n.id)) zij.set(n.id, n);
          if (e.relationType === 'ALTERNATIVE') { alt.set(m.id, n.id); alt.set(n.id, m.id); }
        });
      });
    }
    // Zocht je een film of extra zonder vervolgen? Begin dan bij de serie waar hij bij hoort.
    if (startOpnieuw && ronde === 0 && !volgende.length) {
      const m = knopen.get(startId), ouder = m && m.relations.edges.find(e => e.relationType === 'PARENT' && e.node.type === 'ANIME');
      if (ouder) { startOpnieuw = false; knopen.clear(); zij.clear(); rand = [ouder.node.id]; continue; }
    }
    rand = volgende; ronde++;
  }
  // Wat alleen via een zijverhaal binnenkomt, is altijd een extra (ook als het een serie is)
  const viaZij = new Set([...zij.keys()].filter(id => !knopen.has(id)));
  zij.forEach((n, id) => { if (!knopen.has(id)) knopen.set(id, n); });
  const isDeel = m => !viaZij.has(m.id) && isSeizoen(m);
  const alle = [...knopen.values()].filter(m => m.format && (isDeel(m) || m.format === 'MOVIE')).sort((a, b) => datumWaarde(a) - datumWaarde(b));
  const seizoenen = alle.filter(isDeel);
  const eerste = seizoenen[0] || alle[0];
  const basis = basisNaam(eerste);
  return { basis, plaatje: (eerste.coverImage || {}).large || '', eerste,
    delen: alle.map(m => ({ m, soort: isDeel(m) ? 'seizoen' : 'extra', naam: m === eerste ? '' : kortNaam(mediaNaam(m), basis), alt: alt.has(m.id) && knopen.has(alt.get(m.id)) ? alt.get(m.id) : '' })) };
}
const deelUitMedia = (titelId, x, positie) => ({
  id: 'd' + nieuwId(), titelId, soort: x.soort, positie, naam: x.naam, bronId: x.m.id, formaat: x.m.format || '',
  jaar: (x.m.startDate || {}).year || '', afleveringen: x.m.episodes || '', uitgezonden: x.m.nextAiringEpisode ? x.m.nextAiringEpisode.episode - 1 : '',
  gezien: 0, bronStatus: x.m.status || '', alt: x.alt || '', gecheckt: Date.now() });
const inLijst = id => D().delen.find(d => String(d.bronId) === String(id));

/* ================= Vensters ================= */
const SKELET_RIJEN = n => '<div class="skelet" style="height:var(--rij)"></div>'.repeat(n);

  });
}
let toastTimer, toastActie;
function melding(tekst, knop, actie) {

/** Keuzelijst met alle seizoenen en films; alles staat aan. */

    <button type="button" class="knop breed" data-act="reeks-bewaar" data-id="${titelId || ''}">Toevoegen</button>`;

function bewaarReeks(titelId) {
  const r = S.reeks;
  const gekozen = $$('#venster-inhoud .rij.on').map(b => r.delen[Number(b.dataset.k)]);
  if (!gekozen.length) return melding('Kies minstens één deel.');

  const d = D().delen.find(x => x.id === id);
  bewaarDelen(d.titelId, [{ id, gezien: Math.min(beschikbaar(d), Math.max(0, Math.round(getal(e.target.value)))) }]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'al-zoek') { e.preventDefault(); e.target.blur(); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.aflInvoer) e.target.blur();
  if (e.key === 'Escape' && !$('#venster').hidden) sluitSheet();
});

/* ---------- Vegen naar links (Kage Syztem 5.11) ---------- */
let veeg = null, klikOnderdrukken = false;
const breedte = sw => [...$('.veeg-knoppen', sw).children].reduce((t, b) => t + b.offsetWidth, 0) || 72;
function sluitVeeg() { if (!S.swipeOpen) return; S.swipeOpen = null; $$('.veeg.open').forEach(x => x.classList.remove('open')); }
document.addEventListener('pointerdown', e => {
  const sw = e.target.closest('.veeg');
  if (e.target.closest('.veeg-knoppen')) return;
  if (!sw) { sluitVeeg(); return; }
  if (S.swipeOpen && S.swipeOpen !== sw.dataset.key) sluitVeeg();
  veeg = { el: sw, kaart: $('.veeg-inhoud', sw), x: e.clientX, y: e.clientY, id: e.pointerId, start: sw.classList.contains('open') ? -breedte(sw) : 0, t: 0, actief: false };
});
document.addEventListener('pointermove', e => {
  if (!veeg || e.pointerId !== veeg.id) return;
  const dx = e.clientX - veeg.x, dy = e.clientY - veeg.y;
  if (!veeg.actief) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      veeg.actief = true; S.slepen = true;
      veeg.el.classList.add('bezig');
      veeg.kaart.style.transition = 'none';
      try { veeg.el.setPointerCapture(e.pointerId); } catch (err) {}
    } else if (Math.abs(dy) > 10) { veeg = null; return; }
    else return;
  }
  let t = veeg.start + dx;
  if (t > 0) t = t / 4;
  t = Math.max(t, -veeg.el.offsetWidth);
  veeg.t = t;
  veeg.kaart.style.transform = `translateX(${t}px)`;
});
function eindVeeg(e) {
  if (!veeg || e.pointerId !== veeg.id) return;
  const v = veeg; veeg = null;
  if (!v.actief) return;
  S.slepen = false;
  klikOnderdrukken = true; setTimeout(() => { klikOnderdrukken = false; }, 60);
  v.kaart.style.transition = ''; v.kaart.style.transform = '';
  v.el.classList.remove('bezig');
  if (v.t < -breedte(v.el) / 2) { S.swipeOpen = v.el.dataset.key; v.el.classList.add('open'); }
  else { if (S.swipeOpen === v.el.dataset.key) S.swipeOpen = null; v.el.classList.remove('open'); }
  if (S.uitgesteld) { S.uitgesteld = false; teken(); }
}
document.addEventListener('pointerup', eindVeeg);
document.addEventListener('pointercancel', eindVeeg);
document.addEventListener('click', e => {
  if (klikOnderdrukken) { e.preventDefault(); e.stopPropagation(); return; }
  const sw = e.target.closest('.veeg.open');
  if (sw && !e.target.closest('.veeg-knoppen')) { e.preventDefault(); e.stopPropagation(); sluitVeeg(); }
}, true);

/* ---------- Titel-schakelaar (Kage Syztem 5.1) ---------- */
function menuOpen() { $('#schermmenu').hidden = false; $('#schakelaar').setAttribute('aria-expanded', 'true'); }
function menuDicht() { $('#schermmenu').hidden = true; $('#schakelaar').setAttribute('aria-expanded', 'false'); }
$('#schakelaar').addEventListener('click', () => { if ($('#schermmenu').hidden) menuOpen(); else menuDicht(); });
document.addEventListener('click', e => { if (!$('#schermmenu').hidden && !e.target.closest('#schermmenu, #schakelaar')) menuDicht(); }, true);
$('#scroller').addEventListener('scroll', () => { if (!$('#schermmenu').hidden) menuDicht(); }, { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#schermmenu').hidden) menuDicht(); });

/* ---------- Toetsenbord (iOS), zie Kage Syztem hoofdstuk 10 ---------- */
function pasToetsenbordAan() {
  const vv = window.visualViewport; if (!vv) return;
  const kb = Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop));
  document.documentElement.style.setProperty('--kb', kb + 'px');
  document.body.classList.toggle('toetsenbord', kb > 80);
  houdInBeeld();
}
function houdInBeeld() {
  const el = document.activeElement, vv = window.visualViewport, sc = $('#scroller');
  if (!vv || !el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || !sc.contains(el)) return;
  const r = el.getBoundingClientRect();
  const boven = Math.max($('.kop-wrap').getBoundingClientRect().bottom, vv.offsetTop) + 8;
  const onder = vv.offsetTop + vv.height - 16;
  if (r.bottom > onder) sc.scrollBy(0, Math.min(r.bottom - onder, r.top - boven));
  else if (r.top < boven) sc.scrollBy(0, r.top - boven);
}
if (window.visualViewport) { visualViewport.addEventListener('resize', pasToetsenbordAan); visualViewport.addEventListener('scroll', pasToetsenbordAan); }
document.addEventListener('focusin', () => setTimeout(houdInBeeld, 350));

laad();
</script>
